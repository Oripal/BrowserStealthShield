<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrowserStealthShield · 自有测试页</title><style>body{max-width:680px;margin:48px auto;padding:0 20px;color:#18314d;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif;background:#fbfdff}h1{color:#1259bb}section{border:1px solid #d7e3f2;border-radius:12px;padding:16px;margin:16px 0;background:#fff}button{padding:9px 12px;border:0;border-radius:7px;background:#155ecc;color:#fff;cursor:pointer}output{display:block;margin-top:12px;color:#245d55}small{color:#63768c}</style><script defer src="privacy-check.js"></script></head><body><h1>BrowserStealthShield · 本地验证</h1><p>这是供本机 <code>localhost</code> 访问的实验页，不会将 IP、坐标或测试结果发送出去。</p><section><h2>Geolocation API</h2><p id="permission">读取权限中…</p><button id="geo-test" type="button">主动尝试定位</button><output id="geo-result" role="status"></output><small>浏览器可能弹出位置授权提示；本页面即使定位成功也不显示经纬度。</small></section><section><h2>WebRTC ICE（无外部 STUN）</h2><button id="rtc-test" type="button">主动检查候选类型</button><output id="rtc-result" role="status"></output><small>仅本地候选类型检查。无 STUN，不足以验证公网 IP 泄漏。</small></section></body></html>
